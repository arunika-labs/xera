[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xera"
version = "0.1.7"
description = "A neural network library in JAX, designed for functional programming needs and ease of use with a modern API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ariel Kurniawan" }
]
keywords = ["jax", "neural-network", "deep-learning", "machine-learning"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/arunika-labs/xera"

[tool.hatch.build.targets.wheel]
packages = ["xera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
